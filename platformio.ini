[platformio]
default_envs = esp32dev

[env]
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
  bblanchon/ArduinoJson @ ^7.0.0

[env:esp32dev]
platform = espressif32
board = esp32dev
upload_speed = 460800
board_build.partitions = partitions.csv

; NodeMCU / ESP-12E class boards with 4 MB flash: 1 MB sketch (+ OTA slot), 2 MB LittleFS.
[env:esp8266]
platform = espressif8266
board = nodemcuv2
upload_speed = 460800
board_build.ldscript = eagle.flash.4m2m.ld
; Default lwIP2 (536-byte segments) is slower but far more robust on marginal Wi-Fi than HIGHER_BANDWIDTH.
